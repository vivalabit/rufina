name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tests
            command: test
          - name: typecheck
            command: typecheck
          - name: build
            command: build
          - name: lint
            command: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend ${{ matrix.name }}
        run: pnpm --filter @rufina/web ${{ matrix.command }}

  pytest:
    name: Backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.txt

      - name: Install document-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libreoffice-writer \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-deu \
            tesseract-ocr-eng \
            tesseract-ocr-fra

      - name: Install backend dependencies
        run: >-
          python -m pip install
          --constraint apps/api/constraints.txt
          --editable './apps/api[dev]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run backend tests
        working-directory: apps/api
        run: python -m pytest --quiet

  docker-e2e:
    name: Docker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install E2E dependencies
        run: python -m pip install --requirement tests/e2e/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Docker workspace E2E
        run: bash scripts/run_workspace_e2e.sh
