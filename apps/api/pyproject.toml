[project]
name = "rufina-api"
version = "0.1.0"
description = "FastAPI backend for the Rufina personal job search assistant."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.0",
  "openai>=2.46.0",
  "playwright>=1.51.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "uvicorn[standard]>=0.34.0",
  "pydantic-settings>=2.8.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/resume_pdf/*/*"]
