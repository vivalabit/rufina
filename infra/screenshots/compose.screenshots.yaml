name: tasko-screenshots

services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: local
      AI_BACKEND: openai_api
      OPENAI_API_KEY: screenshot-fixture-disabled
      BRIGHTDATA_API_KEY: ""
      DATABASE_URL: postgresql+psycopg://tasko:tasko@postgres:5432/tasko_screenshots
      TASKO_SETTINGS_FILE: /dev/null
      CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3001}","http://127.0.0.1:${WEB_PORT:-3001}"]'
      OPENCLAW_AI_MATCH_ENABLED: "false"
      OPENCLAW_ASSISTANT_ENABLED: "false"
      OPENCLAW_RESUME_IMPORT_ENABLED: "false"
      OPENCLAW_RESUME_TAILORING_ENABLED: "false"
      RUFINA_SCREENSHOT_MODE: "1"
    volumes:
      - .:/workspace
      - screenshot-openclaw-home:/root/.openclaw
      - screenshot-openclaw-shared-state:/root/.openclaw-shared-state
      - screenshot-openclaw-state:/root/.openclaw/state
      - screenshot-openclaw-npm:${HOME}/.openclaw/npm
      - screenshot-openclaw-workspace:${HOME}/.openclaw/workspace-rufina-assistant
      - screenshot-openclaw-agent:${HOME}/.openclaw/agents/rufina-assistant

  web:
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8001}
        NEXT_PUBLIC_SCREENSHOT_SESSION_ID: ${SCREENSHOT_SESSION_ID:-screenshot-default}
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8001}
      NEXT_PUBLIC_SCREENSHOT_SESSION_ID: ${SCREENSHOT_SESSION_ID:-screenshot-default}

  postgres:
    environment:
      POSTGRES_DB: tasko_screenshots
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasko -d tasko_screenshots"]

volumes:
  screenshot-openclaw-home:
  screenshot-openclaw-shared-state:
  screenshot-openclaw-state:
  screenshot-openclaw-npm:
  screenshot-openclaw-workspace:
  screenshot-openclaw-agent:
