name: tasko

services:
  api:
    image: ${TASKO_API_IMAGE:-tasko-api}:${TASKO_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://tasko:tasko@postgres:5432/tasko
      REDIS_URL: redis://redis:6379/0
      TASKO_SETTINGS_FILE: /var/lib/tasko/settings.env
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      AI_BACKEND: ${AI_BACKEND:-openclaw_codex}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_MODEL: ${OPENAI_API_MODEL:-gpt-5.6-terra}
      OPENAI_API_REASONING_EFFORT: ${OPENAI_API_REASONING_EFFORT:-medium}
      OPENAI_API_TIMEOUT_SECONDS: ${OPENAI_API_TIMEOUT_SECONDS:-120}
      OPENAI_API_MAX_ATTEMPTS: ${OPENAI_API_MAX_ATTEMPTS:-2}
      OPENAI_API_RETRY_BACKOFF_SECONDS: ${OPENAI_API_RETRY_BACKOFF_SECONDS:-0.8}
      OPENCLAW_COMMAND: openclaw
      OPENCLAW_AGENT_ID: rufina-assistant
      JOB_SCREENING_MODEL: ${JOB_SCREENING_MODEL:-openai/gpt-5-mini}
      JOB_SCREENING_REASONING: ${JOB_SCREENING_REASONING:-none}
      JOB_SCREENING_BATCH_SIZE: ${JOB_SCREENING_BATCH_SIZE:-10}
      JOB_SCREENING_TIMEOUT_SECONDS: ${JOB_SCREENING_TIMEOUT_SECONDS:-60}
      JOB_SCREENING_MAX_ATTEMPTS: ${JOB_SCREENING_MAX_ATTEMPTS:-2}
      JOB_SCREENING_MAX_DESCRIPTION_CHARS: ${JOB_SCREENING_MAX_DESCRIPTION_CHARS:-12000}
      OPENCLAW_ASSISTANT_AGENT_ID: rufina-assistant
      OPENCLAW_ASSISTANT_MODEL: openai/gpt-5.6-terra
      OPENCLAW_ASSISTANT_THINKING: "off"
      OPENCLAW_ASSISTANT_TIMEOUT_SECONDS: "120"
      OPENCLAW_ASSISTANT_MAX_ATTEMPTS: "2"
      OPENCLAW_ASSISTANT_RETRY_BACKOFF_SECONDS: "0.8"
      OPENCLAW_ASSISTANT_MAX_PROMPT_CHARS: "48000"
      OPENCLAW_ASSISTANT_MAX_USER_MESSAGE_CHARS: "6000"
      OPENCLAW_ASSISTANT_MAX_HISTORY_MESSAGES: "12"
      OPENCLAW_ASSISTANT_MAX_HISTORY_CHARS: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - tasko-config:/var/lib/tasko
      - ${HOME}/.openclaw:/root/.openclaw
      - ${HOME}/.openclaw/state:/root/.openclaw-shared-state:ro
      - openclaw-tasko-state:/root/.openclaw/state
      - ${HOME}/.openclaw/npm:${HOME}/.openclaw/npm
      - ${HOME}/.openclaw/workspace-rufina-assistant:${HOME}/.openclaw/workspace-rufina-assistant
      - ${HOME}/.openclaw/agents/rufina-assistant:${HOME}/.openclaw/agents/rufina-assistant
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${TASKO_WEB_IMAGE:-tasko-web}:${TASKO_VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      args:
        DEMO_MODE: ${DEMO_MODE:-0}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tasko
      POSTGRES_USER: tasko
      POSTGRES_PASSWORD: tasko
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasko -d tasko"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
  tasko-config:
  openclaw-tasko-state:
